ce,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">x = φ(y, ..)</text><text x="38" y="102.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">y = φ(x, ..)</text><text x="38" y="121.5" fill="#8892A5" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">// parallel copies</text><rect x="292" y="46" width="179" height="116" rx="11" ry="11" fill="#232A35" stroke="#3E7CC0" stroke-width="1.75"/><text x="306" y="61" fill="#7FC4FF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="start" dominant-baseline="central">AFTER</text><text x="306" y="83.5" fill="#83CEA3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">t = y</text><text x="306" y="102.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">x = y</text><text x="306" y="121.5" fill="#83CEA3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">y = t</text><text x="306" y="140.5" fill="#8892A5" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">// temp breaks cycle</text><line x1="204" y1="104.0" x2="280" y2="104.0" stroke="#3E7CC0" stroke-width="2.0" marker-end="url(#ah-p)"/><text x="240.0" y="91.0" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">sequentialize</text><text x="106.0" y="177" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">naive x←y; y←x corrupts</text><text x="381.5" y="177" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Sreedhar: add a temp</text></svg>
