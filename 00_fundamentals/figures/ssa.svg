<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>SSA</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="280.0" y="24" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">SSA form with a φ-node</text><rect x="190" y="50" width="180" height="56" rx="9" ry="9" fill="#6B7B94"/><text x="280.0" y="70.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="280.0" dy="0">BB1</tspan><tspan x="280.0" dy="15">y₁ = x + 1 ; br y₁&gt;0</tspan></text><rect x="60" y="165" width="170" height="50" rx="9" ry="9" fill="#3E7CC0"/><text x="145.0" y="182.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="145.0" dy="0">BB2</tspan><tspan x="145.0" dy="15">y₂ = y₁ * 2</tspan></text><rect x="330" y="165" width="170" height="50" rx="9" ry="9" fill="#3E7CC0"/><text x="415.0" y="182.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="415.0" dy="0">BB3</tspan><tspan x="415.0" dy="15">y₃ = −y₁</tspan></text><rect x="140" y="290" width="280" height="72" rx="9" ry="9" fill="#55637A"/><text x="280.0" y="303.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="280.0" dy="0">BB4</tspan><tspan x="280.0" dy="15">y₄ = φ( y₂ from BB2,</tspan><tspan x="280.0" dy="15">         y₃ from BB3 )</tspan><tspan x="280.0" dy="15">return y₄</tspan></text><line x1="245" y1="106" x2="150" y2="165" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><line x1="315" y1="106" x2="410" y2="165" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><line x1="150" y1="215" x2="230" y2="290" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><line x1="410" y1="215" x2="330" y2="290" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="280.0" y="384" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">each name is assigned exactly once</text></svg>
