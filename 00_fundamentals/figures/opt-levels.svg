<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 320" width="1020" height="320" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Optimization levels</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="510.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">Optimization levels: debuggability ↔ speed</text><text x="40" y="68" fill="#6B7B94" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="central">-O0</text><rect x="150" y="56" width="340" height="20" rx="10" ry="10" fill="#E8E8E8"/><rect x="150" y="56" width="24" height="20" rx="10" ry="10" fill="#3E7CC0"/><text x="502" y="68" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">identity translate; vars kept in memory</text><text x="40" y="102" fill="#6B7B94" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="central">-Og</text><rect x="150" y="90" width="340" height="20" rx="10" ry="10" fill="#E8E8E8"/><rect x="150" y="90" width="61.199999999999996" height="20" rx="10" ry="10" fill="#3E7CC0"/><text x="502" y="102" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">cheap, non-destructive passes; best to debug</text><text x="40" y="136" fill="#6B7B94" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="central">-O1</text><rect x="150" y="124" width="340" height="20" rx="10" ry="10" fill="#E8E8E8"/><rect x="150" y="124" width="115.60000000000001" height="20" rx="10" ry="10" fill="#3E7CC0"/><text x="502" y="136" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">local clean-ups: CSE, jump-thread, inline</text><text x="40" y="170" fill="#6B7B94" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="central">-O2</text><rect x="150" y="158" width="340" height="20" rx="10" ry="10" fill="#E8E8E8"/><rect x="150" y="158" width="204.0" height="20" rx="10" ry="10" fill="#3E7CC0"/><text x="502" y="170" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">loops, vectorize, IPO — most safe opts</text><text x="40" y="204" fill="#6B7B94" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="central">-O3</text><rect x="150" y="192" width="340" height="20" rx="10" ry="10" fill="#E8E8E8"/><rect x="150" y="192" width="265.2" height="20" rx="10" ry="10" fill="#3E7CC0"/><text x="502" y="204" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">aggressive inline + relaxed vectorizer</text><text x="40" y="238" fill="#6B7B94" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="central">-Os / -Oz</text><rect x="150" y="226" width="340" height="20" rx="10" ry="10" fill="#E8E8E8"/><rect x="150" y="226" width="170.0" height="20" rx="10" ry="10" fill="#D9922B"/><text x="502" y="238" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">size-first cost model (Oz = clang)</text><text x="40" y="272" fill="#6B7B94" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="central">-Ofast</text><rect x="150" y="260" width="340" height="20" rx="10" ry="10" fill="#E8E8E8"/><rect x="150" y="260" width="312.8" height="20" rx="10" ry="10" fill="#D65A5F"/><text x="502" y="272" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">-O3 + -ffast-math (breaks IEEE!)</text><text x="150" y="304" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="start" dominant-baseline="central">less optimization</text><text x="490" y="304" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="end" dominant-baseline="central">more optimization</text></svg>
