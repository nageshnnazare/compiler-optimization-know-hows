<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Loop anatomy</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="320.0" y="24" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">Anatomy of a natural loop</text><rect x="220" y="50" width="200" height="46" rx="9" ry="9" fill="#55637A"/><text x="320.0" y="66.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="320.0" dy="0">preheader</tspan><tspan x="320.0" dy="14">runs once before loop</tspan></text><rect x="230" y="130" width="180" height="46" rx="9" ry="9" fill="#3E7CC0"/><text x="320.0" y="146.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="320.0" dy="0">header</tspan><tspan x="320.0" dy="14">loop guard / condition</tspan></text><rect x="230" y="220" width="180" height="46" rx="9" ry="9" fill="#6B7B94"/><text x="320.0" y="236.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="320.0" dy="0">body</tspan><tspan x="320.0" dy="14">the loop's work</tspan></text><rect x="230" y="310" width="180" height="44" rx="9" ry="9" fill="#6B7B94"/><text x="320.0" y="325.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="320.0" dy="0">latch</tspan><tspan x="320.0" dy="14">i++ ; back-edge</tspan></text><rect x="470" y="130" width="140" height="46" rx="9" ry="9" fill="#55637A"/><text x="540.0" y="146.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="540.0" dy="0">exit</tspan><tspan x="540.0" dy="14">after the loop</tspan></text><line x1="320" y1="96" x2="320" y2="130" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><line x1="320" y1="176" x2="320" y2="220" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><line x1="320" y1="266" x2="320" y2="310" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><line x1="410" y1="153" x2="470" y2="153" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="440" y="140" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">false</text><text x="300" y="200" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="end" dominant-baseline="central">true</text><path d="M230 332 C120 332 120 153 230 153" fill="none" stroke="#3E7CC0" stroke-width="2" marker-end="url(#ah-p)"/><text x="120" y="245" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">back-edge</text><text x="320.0" y="410" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">LICM hoists invariants into the preheader; the latch owns the induction variable</text></svg>
