<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 502 206" width="502" height="206" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Loop-invariant code motion (LICM)</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="251.0" y="24" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Loop-invariant code motion (LICM)</text><rect x="24" y="46" width="179" height="97" rx="11" ry="11" fill="#232A35" stroke="#55637A" stroke-width="1.75"/><text x="38" y="61" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="start" dominant-baseline="central">BEFORE</text><text x="38" y="83.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">for (i=0;i&lt;n;i++) {</text><text x="38" y="102.5" fill="#E98A90" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">  a[i]=(x*y+k)*a[i];</text><text x="38" y="121.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text><rect x="307" y="46" width="171" height="116" rx="11" ry="11" fill="#232A35" stroke="#3E7CC0" stroke-width="1.75"/><text x="321" y="61" fill="#7FC4FF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="start" dominant-baseline="central">AFTER</text><text x="321" y="83.5" fill="#7FC4FF" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">t = x*y + k;</text><text x="321" y="102.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">for (i=0;i&lt;n;i++) {</text><text x="321" y="121.5" fill="#83CEA3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">  a[i]=t*a[i];</text><text x="321" y="140.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text><line x1="219" y1="104.0" x2="295" y2="104.0" stroke="#3E7CC0" stroke-width="2.0" marker-end="url(#ah-p)"/><text x="255.0" y="91.0" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">hoist</text><text x="113.5" y="177" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">recomputed every iter</text><text x="392.5" y="177" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">computed once</text></svg>
