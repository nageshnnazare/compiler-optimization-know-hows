 fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">IV-simpl</text><text x="102.0" y="196" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">multiply + index each iter</text><text x="366.0" y="196" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">pointer bump</text></svg>
