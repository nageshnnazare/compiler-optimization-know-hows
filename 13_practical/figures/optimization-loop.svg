<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 250" width="1020" height="250" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Optimization loop</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="510.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">The optimization loop — never guess, measure</text><rect x="24" y="78" width="172" height="66" rx="9" ry="9" fill="#3E7CC0"/><text x="110.0" y="102.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="110.0" dy="0">1 MEASURE</tspan><tspan x="110.0" dy="17">profile first</tspan></text><rect x="223" y="78" width="172" height="66" rx="9" ry="9" fill="#6B7B94"/><text x="309.0" y="102.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="309.0" dy="0">2 ATTRIBUTE</tspan><tspan x="309.0" dy="17">find the hot spot</tspan></text><rect x="422" y="78" width="172" height="66" rx="9" ry="9" fill="#3E7CC0"/><text x="508.0" y="102.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="508.0" dy="0">3 INSPECT</tspan><tspan x="508.0" dy="17">read asm + IR</tspan></text><rect x="621" y="78" width="172" height="66" rx="9" ry="9" fill="#6B7B94"/><text x="707.0" y="102.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="707.0" dy="0">4 CHANGE</tspan><tspan x="707.0" dy="17">source / flags / algo</tspan></text><rect x="820" y="78" width="172" height="66" rx="9" ry="9" fill="#3E7CC0"/><text x="906.0" y="102.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="906.0" dy="0">5 RE-MEASURE</tspan><tspan x="906.0" dy="17">confirm, watch regress</tspan></text><line x1="196" y1="111.0" x2="223" y2="111.0" stroke="#6B7B94" stroke-width="2" marker-end="url(#ah-g)"/><line x1="395" y1="111.0" x2="422" y2="111.0" stroke="#6B7B94" stroke-width="2" marker-end="url(#ah-g)"/><line x1="594" y1="111.0" x2="621" y2="111.0" stroke="#6B7B94" stroke-width="2" marker-end="url(#ah-g)"/><line x1="793" y1="111.0" x2="820" y2="111.0" stroke="#6B7B94" stroke-width="2" marker-end="url(#ah-g)"/><path d="M906.0 144 C906.0 214 110.0 214 110.0 144" fill="none" stroke="#1F918C" stroke-width="2" marker-end="url(#ah-t)"/><text x="508.0" y="204" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">iterate until it stops helping</text></svg>
