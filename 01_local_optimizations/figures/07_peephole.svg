rsive" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="central">combined</text><text x="38" y="103.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">lea rax,[rdi+0]</text><line x1="185" y1="103.5" x2="215" y2="103.5" stroke="#3E7CC0" stroke-width="1.8" marker-end="url(#ah-p)"/><text x="227" y="103.5" fill="#83CEA3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">mov rax, rdi</text><text x="38" y="122.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">cmp eax, 0</text><line x1="185" y1="122.5" x2="215" y2="122.5" stroke="#3E7CC0" stroke-width="1.8" marker-end="url(#ah-p)"/><text x="227" y="122.5" fill="#83CEA3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">test eax, eax</text><text x="38" y="141.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">mov eax,0</text><line x1="185" y1="141.5" x2="215" y2="141.5" stroke="#3E7CC0" stroke-width="1.8" marker-end="url(#ah-p)"/><text x="227" y="141.5" fill="#83CEA3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">xor eax, eax</text><text x="38" y="160.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space