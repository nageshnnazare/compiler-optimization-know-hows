font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="655.0" dy="0">forward: IN → OUT</tspan></text><rect x="560" y="130" width="190" height="40" rx="9" ry="9" fill="#6B7B94"/><text x="655.0" y="150.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="655.0" dy="0">backward: OUT → IN</tspan></text><text x="390.0" y="300" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">iterate to a fixed point over the CFG</text></svg>
