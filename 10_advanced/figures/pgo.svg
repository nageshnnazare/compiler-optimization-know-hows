<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>PGO</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="380.0" y="24" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">Profile-guided optimization feedback loop</text><rect x="60" y="70" width="170" height="66" rx="9" ry="9" fill="#6B7B94"/><text x="145.0" y="95.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="145.0" dy="0">1. instrument</tspan><tspan x="145.0" dy="15">clang -fprofile-generate</tspan></text><rect x="300" y="70" width="170" height="66" rx="9" ry="9" fill="#3E7CC0"/><text x="385.0" y="95.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="385.0" dy="0">2. run workload</tspan><tspan x="385.0" dy="15">collect .profraw counts</tspan></text><rect x="540" y="70" width="170" height="66" rx="9" ry="9" fill="#6B7B94"/><text x="625.0" y="95.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="625.0" dy="0">3. merge</tspan><tspan x="625.0" dy="15">llvm-profdata → .profdata</tspan></text><rect x="300" y="190" width="170" height="66" rx="9" ry="9" fill="#3E7CC0"/><text x="385.0" y="215.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="385.0" dy="0">4. re-optimize</tspan><tspan x="385.0" dy="15">clang -fprofile-use</tspan></text><line x1="230" y1="103.0" x2="300" y2="103.0" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><line x1="470" y1="103.0" x2="540" y2="103.0" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><path d="M625.0 136 C625.0 150 490 150 470 223.0" fill="none" stroke="#3E7CC0" stroke-width="2" marker-end="url(#ah-p)"/><path d="M300 223.0 C160 223.0 145 150 145 136" fill="none" stroke="#1F918C" stroke-width="2" marker-end="url(#ah-t)"/><text x="150" y="165" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">hot/cold layout,</text><text x="150" y="180" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">inline &amp; branch hints</text></svg>
