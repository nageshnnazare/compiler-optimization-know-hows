no',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">for (i=0;i&lt;n;i++)</text><text x="38" y="102.5" fill="#E98A90" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (a[i]&gt;0)</text><text x="38" y="121.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">    b[i]=a[i]*2;</text><rect x="284" y="46" width="164" height="116" rx="11" ry="11" fill="#232A35" stroke="#3E7CC0" stroke-width="1.75"/><text x="298" y="61" fill="#7FC4FF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="start" dominant-baseline="central">AFTER</text><text x="298" y="83.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">va = a[i:i+VF];</text><text x="298" y="102.5" fill="#7FC4FF" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">m = va &gt; 0;</text><text x="298" y="121.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">r = va * 2;</text><text x="298" y="140.5" fill="#83CEA3" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">mstore b[i:], r, m</text><line x1="196" y1="104.0" x2="272" y2="104.0" stroke="#3E7CC0" stroke-width="2.0" marker-end="url(#ah-p)"/><text x="232.0" y="91.0" fi