il','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">stackify</text><text x="98.5" y="177" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">heap alloc never escapes</text><text x="347.5" y="177" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">scalarized away</text></svg>
