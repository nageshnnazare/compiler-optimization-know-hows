<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Inlining</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="380.0" y="24" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">Inlining removes the call boundary</text><text x="170" y="58" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">before</text><rect x="60" y="78" width="220" height="60" rx="9" ry="9" fill="#6B7B94"/><text x="170.0" y="100.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="170.0" dy="0">caller</tspan><tspan x="170.0" dy="15">… t = add(x, y) ; …</tspan></text><rect x="90" y="180" width="160" height="56" rx="9" ry="9" fill="#3E7CC0"/><text x="170.0" y="200.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="170.0" dy="0">callee add()</tspan><tspan x="170.0" dy="15">return a + b</tspan></text><line x1="170" y1="138" x2="170" y2="180" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="258" y="160" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="start" dominant-baseline="central">call</text><path d="M250 208 C300 208 300 108 280 108" fill="none" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="300" y="165" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="start" dominant-baseline="central">return</text><line x1="360" y1="150" x2="450" y2="150" stroke="#6B7B94" stroke-width="2" marker-end="url(#ah-g)"/><text x="610" y="58" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">after</text><rect x="490" y="100" width="250" height="90" rx="9" ry="9" fill="#3E7CC0"/><text x="615.0" y="129.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="615.0" dy="0">caller (add inlined)</tspan><tspan x="615.0" dy="16">… t = x + y ; …</tspan><tspan x="615.0" dy="16">no call · no frame · arg copies gone</tspan></text><text x="615" y="224" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">unlocks